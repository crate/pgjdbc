name: Stock baseline

on:
  push:
    branches:
      - 'REL*_crate'
  pull_request:

permissions:
  contents: read

jobs:
  stock-baseline:
    name: Stock baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 50
      - name: Start PostgreSQL
        working-directory: docker/postgres-server
        run: docker compose up -d --wait || { docker compose logs; exit 1; }
      - name: 'Set up JDK 21'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: 21
      - uses: burrunan/gradle-cache-action@4b67497abd37a511d6c1dc6299bdd84ff39f7bf5 # v3.0.2
        name: Prepare source distribution
        env:
          S3_BUILD_CACHE_ACCESS_KEY_ID: ${{ secrets.S3_BUILD_CACHE_ACCESS_KEY_ID }}
          S3_BUILD_CACHE_SECRET_KEY: ${{ secrets.S3_BUILD_CACHE_SECRET_KEY }}
        with:
          job-id: stock-baseline-jdk21
          arguments: --no-parallel --no-daemon sourceDistribution -Ppgjdbc.version=1.0 -Prelease -Psigning.pgp.enabled=OFF
      - name: Run the stock suite
        working-directory: pgjdbc/build/distributions
        shell: bash
        # language=bash
        run: |
          tar xzf postgresql-1.0-jdbc-src.tar.gz
          cd postgresql-1.0-jdbc-src
          mvn --batch-mode --show-version -Dmaven.test.failure.ignore=true verify | tee "$GITHUB_WORKSPACE/stock-suite.log"
      - name: Compare the failures with the expected list
        run: python3 .github/stock-baseline/check.py stock-suite.log .github/stock-baseline/expected-failures.txt
